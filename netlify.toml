# The Next.js app lives in frontend/. Netlify auto-detects Next.js there and
# applies the OpenNext adapter (SSR, API routes, middleware).
[build]
  base = "frontend"
  # Install locked deps first so the project's pinned Prisma CLI (v6) is used,
  # rather than npx fetching an unrelated latest/prerelease version.
  command = "npm ci && npm run prisma:generate && npm run build"
  publish = ".next"
