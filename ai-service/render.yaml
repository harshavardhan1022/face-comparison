services:
  - type: web
    name: ai-face-similarity-backend
    runtime: python
    region: singapore  # Closest to India — change to 'oregon' if needed
    plan: free         # Upgrade to 'starter' for always-on (no cold starts)
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /api/v1/health
