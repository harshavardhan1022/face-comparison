version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: face-similarity-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - ai-service
    networks:
      - internal-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Production Database
  postgres:
    image: postgres:16-alpine
    container_name: face-similarity-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-facesimilarity}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Python FastAPI AI Inference Service
  ai-service:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.ai-service
    container_name: face-similarity-ai
    restart: always
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
      - ENVIRONMENT=production
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js Full-Stack Application
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: face-similarity-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-facesimilarity}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-production-face-similarity-2026-auth}
      - ADMIN_REGISTRATION_SECRET=${ADMIN_REGISTRATION_SECRET:-admin-secret-provisioning-key-2026}
      - AI_SERVICE_INTERNAL_URL=http://ai-service:8000
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:8000
      - MAX_UPLOAD_SIZE_MB=10
    networks:
      - internal-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

